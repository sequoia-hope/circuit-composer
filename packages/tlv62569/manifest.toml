# Circuit Composer package: Texas Instruments TLV62569, 2 A synchronous step-down converter.
#
# 0.1.0: the DBV (SOT-23-5) variant as the datasheet's typical application, set for 3.3 V out
# from a 1S LiPo (3.0-4.2 V) or USB 5 V, 600 mA for the milestone 5 board; pins, cited rules
# with part-value checks, and a buck intent block. No generated or verified layout yet.

[package]
name = "tlv62569"
version = "0.1.0"
family = "TLV62569"
license = "MIT"
summary = "TLV62569DBV 2 A buck: 3.3 V typical application (external divider, 2.2 uH), ports, cited rules, buck intent block"

[[variants]]
name = "TLV62569DBV"
package = "SOT-23-5 (DBV0005A), 2.9 x 2.8 mm body (nominal, p.1)"
footprint = "Package_TO_SOT_SMD:SOT-23-5"
power_good = false
# PG exists only on TLV62569PDDC (SOT-23-6) and TLV62569PDRL (SOT563); not packaged here.

[sources]
# Document revisions this package was built from; hashes in sources/sources.json.
datasheet = "TI SLVSDG1C, revised October 2017 (sha256 1ba6f55d…)"
