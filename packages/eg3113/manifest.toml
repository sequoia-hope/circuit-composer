# Circuit Composer package: EGmicro EG3113 half-bridge gate driver, one phase with its MOSFETs.
#
# 0.1.0: one half-bridge of the RP2350 motor controller rev A (~/pcb/rp2350-motor-controller,
# hardware/rev-A, tag rev-A-fab), phase A: driver U1, MOSFETs AH1/AL1 and the parts on their nets
# that serve them. The datasheet's typical application (Figure 6-1, PDF p.6) plus the board's
# bootstrap resistor, turn-off options, low-side PNP turn-off, per-bridge bus capacitor and unfitted
# snubbers. Pin table and HIN/LIN levels (ports.json), cited rules (rules.json), a KiCad symbol
# (kicad/). Measured layout: boards/rp2350-motor-controller/mined/bridges/.

[package]
name = "eg3113"
version = "0.1.0"
family = "EG3113"
license = "MIT"
summary = "EG3113 half-bridge driver (SOP-8) with BSC030N08NS5 MOSFETs, bootstrap and gate network, as one phase of the RP2350 motor controller: circuit, ports, HIN/LIN levels, cited rules"

[[variants]]
name = "EG3113"
mpn = "EG3113"
package = "SOP-8"
footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"
symbol = "Driver_FET_EG3113:EG3113"
mosfet = "BSC030N08NS5"
vcc_v = 5.0
# HIN active high, LIN active low (port LIN_N). KiCad has no EG3113 symbol; the board uses its own
# MotorBuck:EG2131 valued EG3113. The package carries one in kicad/ (checked pin by pin against
# Figure 4-1 and §4.2, PDF p.5). The datasheet also lists a DFN8 package (PDF p.12), not modelled.

[sources]
# Document revisions this package was built from; hashes in sources/sources.json.
datasheet = "EGmicro EG3113 芯片数据手册 V1.2 (egmicro.com, PDF of 2024-05-27; Chinese only) (sha256 27eec46b…)"
mosfet = "Infineon BSC030N08NS5 Rev. 2.3, 2019-10-31 (sha256 fb2962a3…)"

# LCSC parts the circuit names. Stock is JLCPCB's, from
# ~/Software/easy_pcb/.claude/skills/pcb-design/scripts/jlc_parts.py show, on the date given.
# The unfitted roles (CGSL, RSNH, CSNH, RSNL, CSNL) have no LCSC part on the board.
