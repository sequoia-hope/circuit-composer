name: Pages

# The site is the repository as it is (the project page, board viewers and tools), with the
# Circuit Composer app built into app/dist/. The app runs with no server: its core is WASM and it
# opens the example boards in app/web/public/examples/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Build the app
        run: app/build.sh
      - name: Assemble the site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/app/web
          mkdir -p _site/app/dist
          cp -r app/dist/. _site/app/dist/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
