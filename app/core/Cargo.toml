[package]
name = "composer-core"
description = "Circuit Composer app core: the floorplanner and the board document, for the browser"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
floorplan = { path = "../../crates/floorplan" }
shape = { path = "../../crates/shape" }
pinsolve = { path = "../../crates/pinsolve" }
interfaces = { path = "../../crates/interfaces" }
# The board renderer shared with UltraRoute Studio; the JS half is pinned at the same commit in
# app/web/package.json.
board-draw = { git = "https://github.com/sequoia-hope/board-draw", rev = "b45cc3f689dc7b5086be9dada3dd64381a3d010e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.129", optional = true }
js-sys = { version = "0.3", optional = true }

# The machine's wasm-opt (116) cannot parse what current Rust emits; the module is small as is.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
