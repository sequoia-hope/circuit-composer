[package]
name = "floorplan"
version.workspace = true
edition.workspace = true
license.workspace = true

# The floorplanner: every part placed (position and quarter turn) by simulated annealing on
# pad-to-pad wirelength, courtyard overlap and board area, with block cohesion, placement hints,
# rigid groups (generated block layouts), connectors at the edge and separation between
# aggressor and victim blocks. Out comes a placement and the board outline it needs.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
