[package]
name = "library"
version.workspace = true
edition.workspace = true
license.workspace = true

# The research library: cited claims from datasheets, application notes, reference boards and
# talks, with their sources, statuses and links. `library/` holds the claims that apply to a
# circuit class; each package's `rules.json` holds its chip's. They are one database.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
