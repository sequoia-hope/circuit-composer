[package]
name = "ccomp"
version.workspace = true
edition.workspace = true
license.workspace = true

# The command-line harness: every stage reads files and writes files plus a JSON result.

[dependencies]
intent = { path = "../intent" }
pcb = { path = "../pcb" }
recognise = { path = "../recognise" }
verify = { path = "../verify" }
blockgen = { path = "../blockgen" }
compile = { path = "../compile" }
library = { path = "../library" }
interfaces = { path = "../interfaces" }
pinsolve = { path = "../pinsolve" }
compose = { path = "../compose" }
floorplan = { path = "../floorplan" }
shape = { path = "../shape" }
board-interface = { git = "https://github.com/sequoia-hope/board-interface", tag = "v0.2.2" }
serde = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
