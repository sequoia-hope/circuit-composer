[package]
name = "pcb"
version.workspace = true
edition.workspace = true
license.workspace = true

# A KiCad board as the verifier and generators see it: parts, pads, tracks, vias and filled
# zones per net, in millimetres, plus the geometry they are measured with. Reading is
# ultraroute's `kicad-pcb` crate (MIT), pinned to a commit.

[dependencies]
kicad-pcb = { git = "https://github.com/sequoia-hope/ultraroute", rev = "0e581c467fd43013b60c1c2ddab490e671851bee" }
serde = { version = "1", features = ["derive"] }
