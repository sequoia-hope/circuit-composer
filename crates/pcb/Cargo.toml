[package]
name = "pcb"
version.workspace = true
edition.workspace = true
license.workspace = true

# A KiCad board as the verifier and generators see it: parts, pads, tracks, vias and filled
# zones per net, in millimetres, plus the geometry they are measured with. Reading is
# ultraroute's `kicad-pcb` crate (MIT), pinned to a commit.

[dependencies]
kicad-pcb = { git = "https://github.com/sequoia-hope/ultraroute", rev = "8c691ec359d36b83de95323e321a17ee2bf3dafe" }
serde = { version = "1", features = ["derive"] }
